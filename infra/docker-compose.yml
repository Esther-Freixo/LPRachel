services:
  postgres:
    image: postgres:16-alpine
    container_name: rf_postgres
    environment:
      POSTGRES_USER: rf
      POSTGRES_PASSWORD: rf_local_dev
      POSTGRES_DB: rachel
    ports:
      # host 5433 -> container 5432 (5432 já é usado por um Postgres nativo no host)
      - "5433:5432"
    volumes:
      - rf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rf -d rachel"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rf_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rf_minio
      MINIO_ROOT_PASSWORD: rf_minio_local_dev
    ports:
      # host 9100/9101 -> container 9000/9001 (9000/9001 ocupadas no host)
      - "9100:9000"
      - "9101:9001"
    volumes:
      - rf_minio_data:/data

volumes:
  rf_pg_data:
  rf_minio_data:
